# Secrets for a self-hosted Plan tracker. install.sh copies this file to
# .streamlit/secrets.toml once; edit that copy on the server. It is listed in
# .gitignore, so it never goes back to the repo. Never put real values here.
#
# With only [duo] filled in (or nothing at all), the app is a single,
# loginless tracker with one tracker.db on the server, which is the simplest
# setup and the one to keep unless you want separate accounts.

# The Duo page and tick mirroring to the shared tracker. Optional.
[duo]
# The public base URL of the duo API (the same one its health check uses,
# without the trailing /api/health).
url = "https://<the duo server>"
password = "<your own duo password>"
# Only needed in cloud mode (accounts): mirror ticks for this account alone.
# email = "<your account email>"

# --- Optional. Uncomment a section to turn the feature on. -------------------

# The Journal page: a Neon Postgres database (free tier).
# [neon]
# url = "postgresql://USER:PASSWORD@HOST/DB?sslmode=require"

# The Telegram journal bot. Needs [neon] too. Runs inside the app process.
# [telegram]
# token = "<the token BotFather gives you>"
# access_code = "<a code every new chat must send before the bot answers>"

# Cloud mode: a login page and a separate database per account, parked in a
# Supabase storage bucket. Needs BOTH [auth] and [supabase]. Leave both out
# for a plain single-user tracker. The redirect_uri must be the public URL of
# the app plus /oauth2callback, and the same URI must be registered on the
# Google OAuth client.
# [auth]
# redirect_uri = "https://aauaiandrobotics.com/tracker/oauth2callback"
# cookie_secret = "<any long random string>"
# client_id = "<google client id>"
# client_secret = "<google client secret>"
# server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
#
# [supabase]
# url = "https://<project>.supabase.co"
# key = "<service_role key>"
# bucket = "trackers"
